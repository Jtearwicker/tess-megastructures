<svg viewBox="0 0 980 1140" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#3a3a3a"/></marker>
    <marker id="arrowmuted" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#8a7a55"/></marker>
    <marker id="arrowteal" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#3a8a8a"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="1140" fill="#fbfaf7"/>

  <text x="490" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">MegaMiner — anomaly-surfacing pipeline (settled)</text>
  <text x="490" y="62" text-anchor="middle" font-size="13" fill="#5a5a5a">one hard cut (catalogued EBs) · one reversible filter (secondary eclipse) · classifiers only annotate</text>

  <!-- Ingest -->
  <rect x="340" y="92" width="300" height="56" rx="8" fill="#eef2f6" stroke="#64748b" stroke-width="1.5"/>
  <text x="490" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Ingest &amp; Parse</text>
  <text x="490" y="134" text-anchor="middle" font-size="12" fill="#465563">MAST TESS sectors &#8594; TCEs</text>
  <line x1="490" y1="148" x2="490" y2="180" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Score -->
  <rect x="340" y="182" width="300" height="70" rx="8" fill="#e6effb" stroke="#3b6fb5" stroke-width="1.5"/>
  <text x="490" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#12233a">Annotate &amp; Score</text>
  <text x="490" y="224" text-anchor="middle" font-size="11.5" fill="#2f4a68">anomaly_score = model-misfit ranker</text>
  <text x="490" y="242" text-anchor="middle" font-size="11.5" fill="#2f4a68">attach flag columns — annotations, not cuts</text>
  <line x1="490" y1="252" x2="490" y2="284" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Hard cut -->
  <rect x="340" y="286" width="300" height="58" rx="8" fill="#fbeaea" stroke="#c0504d" stroke-width="1.5"/>
  <text x="490" y="309" text-anchor="middle" font-size="14" font-weight="700" fill="#7a2b28">Hard cut — the only removal</text>
  <text x="490" y="329" text-anchor="middle" font-size="11.5" fill="#8a3b38">catalogued EBs (flag_catalog_eb)</text>

  <!-- Removed bin -->
  <rect x="40" y="284" width="260" height="82" rx="8" fill="#f3ecec" stroke="#b08585" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="170" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#6e4a4a">Removed — catalogued EBs</text>
  <text x="170" y="326" text-anchor="middle" font-size="11" fill="#6e4a4a">Pr&#353;a · Kostov · Oddo · CALNet</text>
  <text x="170" y="344" text-anchor="middle" font-size="11" fill="#6e4a4a">also TOIs / confirmed planets, variables</text>
  <text x="170" y="360" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8a5a5a">confirmed boring — gone in every view</text>
  <line x1="340" y1="315" x2="302" y2="315" stroke="#c0504d" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="321" y="308" text-anchor="middle" font-size="10.5" fill="#a2413d">cut</text>

  <line x1="490" y1="344" x2="490" y2="376" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="504" y="364" text-anchor="start" font-size="10.5" fill="#3a7a45">keep</text>

  <!-- Working set -->
  <rect x="340" y="378" width="300" height="62" rx="8" fill="#eef2f6" stroke="#475569" stroke-width="1.5"/>
  <text x="490" y="402" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Working set</text>
  <text x="490" y="422" text-anchor="middle" font-size="11.5" fill="#465563">&#8776;116k signals · ranked by anomaly_score</text>

  <!-- Reliability panel -->
  <rect x="690" y="378" width="260" height="150" rx="8" fill="#eef1f4" stroke="#7a8a99" stroke-width="1.4"/>
  <text x="820" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#33414d">Reliability axis — orthogonal</text>
  <text x="820" y="421" text-anchor="middle" font-size="11" fill="#41525f">implausible metrics · corruption</text>
  <text x="820" y="439" text-anchor="middle" font-size="11" fill="#41525f">marginal SNR · non-convergence</text>
  <text x="820" y="460" text-anchor="middle" font-size="11" font-style="italic" fill="#5a6b78">&#8594; tag "needs review", never remove</text>
  <text x="820" y="482" text-anchor="middle" font-size="10.5" fill="#5a6b78">non-converged + high-SNR =</text>
  <text x="820" y="497" text-anchor="middle" font-size="10.5" fill="#5a6b78">more interesting, not less</text>
  <text x="820" y="516" text-anchor="middle" font-size="10.5" font-style="italic" fill="#5a6b78">sets vetting priority</text>
  <line x1="640" y1="409" x2="688" y2="409" stroke="#7a8a99" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="664" y="402" text-anchor="middle" font-size="10.5" fill="#5a6b78">tag</text>

  <line x1="490" y1="440" x2="490" y2="470" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- EB discrimination container -->
  <rect x="316" y="472" width="348" height="366" rx="10" fill="#fbf8f0" stroke="#b8a878" stroke-width="1.6"/>
  <text x="490" y="493" text-anchor="middle" font-size="14" font-weight="700" fill="#5c4f2e">EB discrimination</text>
  <text x="490" y="509" text-anchor="middle" font-size="11" fill="#7a6c46">operates on the full working set — only layer 1 hides, and reversibly</text>

  <!-- Zone A FILTER -->
  <text x="490" y="529" text-anchor="middle" font-size="12" font-weight="700" fill="#2c6e6e">FILTER · reversible, audited hide</text>
  <rect x="332" y="534" width="316" height="50" rx="6" fill="#e6f2f2" stroke="#3a8a8a" stroke-width="1.3"/>
  <text x="490" y="552" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5a5a">Layer 1 · weak_secondary_robust_statistic &#8805; 7</text>
  <text x="490" y="569" text-anchor="middle" font-size="10.5" fill="#2c6363">a positive secondary-eclipse detection (a second star)</text>
  <text x="490" y="599" text-anchor="middle" font-size="10" font-style="italic" fill="#2c6e6e">calibrated on 436 CP/KP hosts: hides 0 confirmed planets, catches ~24% of catalogued EBs</text>
  <line x1="332" y1="559" x2="302" y2="559" stroke="#3a8a8a" stroke-width="1.7" marker-end="url(#arrowteal)"/>
  <text x="317" y="552" text-anchor="middle" font-size="10" fill="#2c6e6e">hide</text>

  <line x1="336" y1="612" x2="644" y2="612" stroke="#cdbf9a" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Zone B DOWN-RANK -->
  <text x="490" y="630" text-anchor="middle" font-size="12" font-weight="700" fill="#8a6a12">DOWN-RANK · annotate, never gate</text>
  <rect x="332" y="636" width="316" height="52" rx="6" fill="#fbeecb" stroke="#c99a3a" stroke-width="1.2"/>
  <text x="490" y="654" text-anchor="middle" font-size="12" font-weight="700" fill="#6e5210">eb_likelihood (0–1 annotation)</text>
  <text x="490" y="670" text-anchor="middle" font-size="10.5" fill="#7a5e18">odd-even · ghost · radius ratio · SPOC EB flag</text>
  <text x="490" y="683" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8a6a22">rejected as filters — each hides confirmed planets</text>
  <line x1="490" y1="688" x2="490" y2="697" stroke="#b58a2e" stroke-width="1.6" marker-end="url(#arrowmuted)"/>
  <rect x="332" y="698" width="316" height="42" rx="6" fill="#fbeecb" stroke="#c99a3a" stroke-width="1.2"/>
  <text x="490" y="715" text-anchor="middle" font-size="12" font-weight="700" fill="#6e5210">ExoMiner probabilistic score</text>
  <text x="490" y="731" text-anchor="middle" font-size="10.5" fill="#7a5e18">2-min coverage only · ~3% EB&#8594;PC leak</text>
  <line x1="490" y1="740" x2="490" y2="749" stroke="#b58a2e" stroke-width="1.6" marker-end="url(#arrowmuted)"/>
  <rect x="332" y="750" width="316" height="44" rx="6" fill="#fbeecb" stroke="#c99a3a" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="490" y="767" text-anchor="middle" font-size="12" font-weight="700" fill="#6e5210">EB-rejection CNN (in development)</text>
  <text x="490" y="783" text-anchor="middle" font-size="10.5" fill="#7a5e18">catches slip-throughs · covers FFI gap</text>
  <text x="490" y="814" text-anchor="middle" font-size="10" font-style="italic" fill="#8a6a22">classifiers supersede eb_likelihood; a classifier can reject a true anomaly, so none removes a row</text>
  <text x="490" y="828" text-anchor="middle" font-size="10" font-style="italic" fill="#8a6a22">order = coverage widening: DV stats &#8594; ExoMiner (2-min) &#8594; CNN (all)</text>

  <!-- Hidden bin -->
  <rect x="40" y="532" width="260" height="90" rx="8" fill="#e6f2f2" stroke="#3a8a8a" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="170" y="554" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5a5a">Hidden EB set</text>
  <text x="170" y="574" text-anchor="middle" font-size="11" fill="#2c6363">hidden in private / public views</text>
  <text x="170" y="592" text-anchor="middle" font-size="11" fill="#2c6363">marked (not removed) in full view</text>
  <text x="170" y="610" text-anchor="middle" font-size="10.5" font-style="italic" fill="#3a7a7a">retained · logged · audited · reversible</text>

  <line x1="490" y1="838" x2="490" y2="872" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Candidates -->
  <rect x="316" y="874" width="348" height="64" rx="8" fill="#e9f6ec" stroke="#4a9d5b" stroke-width="1.8"/>
  <text x="490" y="899" text-anchor="middle" font-size="15" font-weight="700" fill="#1f5e2e">Anomaly candidates</text>
  <text x="490" y="920" text-anchor="middle" font-size="11" fill="#2e6e3c">high anomaly_score · not catalogued · layer-1 EBs removed</text>

  <line x1="490" y1="938" x2="490" y2="970" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Vetting -->
  <rect x="340" y="972" width="300" height="74" rx="8" fill="#eef2f6" stroke="#475569" stroke-width="1.5"/>
  <text x="490" y="994" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Vetting &#8594; confirmed candidates</text>
  <text x="490" y="1015" text-anchor="middle" font-size="11" fill="#465563">now: human DV review</text>
  <text x="490" y="1033" text-anchor="middle" font-size="11" font-style="italic" fill="#7a5aa0">future: agentic LLM vetting</text>

  <path d="M840,528 C905,760 885,976 646,1010" fill="none" stroke="#7a8a99" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="906" y="770" text-anchor="middle" font-size="10.5" font-style="italic" fill="#5a6b78" transform="rotate(90 906 770)">review priority</text>

  <!-- Legend -->
  <rect x="60" y="1078" width="14" height="14" rx="2" fill="#fbeaea" stroke="#c0504d" stroke-width="1.3"/>
  <text x="80" y="1089" font-size="11" fill="#3a3a3a">hard cut (catalog)</text>
  <rect x="238" y="1078" width="14" height="14" rx="2" fill="#e6f2f2" stroke="#3a8a8a" stroke-width="1.3"/>
  <text x="258" y="1089" font-size="11" fill="#3a3a3a">filter — hide (reversible)</text>
  <rect x="452" y="1078" width="14" height="14" rx="2" fill="#fbeecb" stroke="#c99a3a" stroke-width="1.3"/>
  <text x="472" y="1089" font-size="11" fill="#3a3a3a">down-rank / annotate</text>
  <rect x="650" y="1078" width="14" height="14" rx="2" fill="#eef1f4" stroke="#7a8a99" stroke-width="1.3"/>
  <text x="670" y="1089" font-size="11" fill="#3a3a3a">tag (reliability)</text>
  <rect x="828" y="1078" width="14" height="14" rx="2" fill="#e9f6ec" stroke="#4a9d5b" stroke-width="1.3"/>
  <text x="848" y="1089" font-size="11" fill="#3a3a3a">candidates</text>
</svg>
