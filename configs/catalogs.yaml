# =============================================================================
# Reference catalog inventory (Subsystem B3)
# =============================================================================
# Each catalog entry records:
#   - source: where to download from (URL or DOI)
#   - local_filename: the expected filename in <paths.literature_dir>
#   - retrieved: date the local copy was downloaded (YYYY-MM-DD)
#   - reference: bibliographic citation
#   - description: what this catalog is, for documentation purposes
#
# Re-download every ~6 months and bump the `retrieved` date. If the
# upstream catalog publishes a new version, treat it as a new catalog
# entry rather than overwriting (e.g., kostov2025 -> kostov2026).
# =============================================================================

catalogs:
  prsa2022_eb:
    source: "https://cdsarc.cds.unistra.fr/viz-bin/cat/J/ApJS/258/16"
    local_filename: "prsa2022_binary_catalog.csv"
    retrieved: "TODO"
    reference: "Prsa et al. 2022, ApJS, 258, 16"
    description: "TESS Eclipsing Binary Stars I: 4,584 EBs in Sectors 1-26."

  kostov2025_eb_new:
